# Configuración de despliegue en Railway (config-as-code).
# El build usa el Dockerfile del repositorio; la base vive en Neon y no en Railway.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server.js"
# Liveness (no toca la base): si Neon parpadea, el contenedor no se reinicia.
healthcheckPath = "/api/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Aplica migraciones pendientes antes de levantar la versión nueva.
preDeployCommand = "prisma migrate deploy"
