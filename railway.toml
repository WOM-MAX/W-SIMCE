# Configuración de despliegue en Railway (config-as-code).
# El build usa el Dockerfile del repositorio; la base vive en Neon y no en Railway.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Aplica migraciones pendientes antes de levantar la versión nueva.
preDeployCommand = "npx prisma migrate deploy"
