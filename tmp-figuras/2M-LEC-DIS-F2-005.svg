<svg xmlns="http://www.w3.org/2000/svg" width="340" height="369.1" viewBox="0 0 340 369.1"><rect width="340" height="369.1" fill="#ffffff"/><text x="8" y="18" font-size="12" font-weight="700" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>BIBLIOTECA DE HERRAMIENTAS DEL BARRIO</tspan></text><text x="8" y="37.6" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>Inscripciones abiertas hasta el 15 de octubre</tspan></text><line x1="8" y1="47.65000000000001" x2="332" y2="47.65000000000001" stroke="#000" stroke-width="0.6"/><text x="8" y="54.65000000000001" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>Prestamos taladros, escaleras, máquinas de coser, carretillas y</tspan></text><text x="8" y="65.275" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>herramientas de jardín que casi nadie usa todos los días.</tspan></text><text x="8" y="81.75" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>- Se atiende en la sede de la junta de vecinos, los sábados de 10:00 a</tspan></text><text x="8" y="92.375" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>13:00. Cada familia puede llevar hasta dos herramientas por semana.</tspan></text><text x="8" y="119.9" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>- El préstamo dura siete días y se puede renovar una vez, si nadie más</tspan></text><text x="8" y="130.525" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>pidió la herramienta.</tspan></text><text x="8" y="147" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>- Para inscribirse hay que llevar la cuenta de la luz o el contrato de</tspan></text><text x="8" y="157.625" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>arriendo del mes, para acreditar que la familia vive en el barrio.</tspan></text><text x="8" y="185.15" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>- Cada herramienta se revisa con quien la lleva y con quien la</tspan></text><text x="8" y="195.775" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>devuelve, y la ficha anota en qué estado salió y en qué estado volvió.</tspan></text><text x="8" y="223.3" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>- Si una herramienta se devuelve con una pieza quebrada, la familia no</tspan></text><text x="8" y="233.925" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>paga la reparación: la paga el fondo de la biblioteca. Sí se pierde el</tspan></text><text x="8" y="244.55" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>turno por un mes.</tspan></text><text x="8" y="261.45" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>- Si la herramienta se pierde, la familia repone otra de las mismas</tspan></text><text x="8" y="272.075" font-size="8.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>características o paga su valor según la lista de precios del catálogo.</tspan></text><rect x="8" y="291.6" width="324" height="22" fill="#d9d9d9" stroke="#000" stroke-width="0.6"/><text x="13" y="302.6" font-size="9" font-weight="700" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>Un barrio que comparte arregla menos y presta más.</tspan></text><line x1="8" y1="329.6" x2="332" y2="329.6" stroke="#000" stroke-width="0.5"/><text x="8" y="340.6" font-size="7.5" font-weight="400" font-family="Helvetica, Arial, sans-serif" text-anchor="start" fill="#000"><tspan>Organizan: junta de vecinos y taller de oficios. Colabora: la municipalidad.</tspan></text><rect x="0" y="0" width="340" height="369.1" fill="none" stroke="#000" stroke-width="1"/></svg>